spring:
  application:
    name: studyhub

  # ── Database ─────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/studyhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:studyhub}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA ──────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate validates only
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 50

  # ── Flyway ───────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ── Security / Session ───────────────────────────────────────────────────
  # No server-side HTTP sessions — stateless JWT
  session:
    store-type: none

# ── Server ───────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  # Secure cookies require HTTPS in production
  # Set via environment; local dev uses HTTP
  forward-headers-strategy: native

# ── StudyHub application properties ──────────────────────────────────────────
studyhub:
  # JWT — secrets MUST be overridden via environment in production
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:CHANGE_ME_IN_PRODUCTION_min32chars_accesssecret}
    access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}          # 15 minutes
    refresh-secret: ${JWT_REFRESH_SECRET:CHANGE_ME_IN_PRODUCTION_min32chars_refreshsecret}
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}     # 7 days

  # Refresh cookie
  cookie:
    domain: ${COOKIE_DOMAIN:localhost}
    secure: ${COOKIE_SECURE:false}       # true in production (HTTPS)
    same-site: Strict

  # CORS — allowlist only; no wildcard in production
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  # Pilot constraints (DR-025)
  pilot:
    max-learners: ${PILOT_MAX_LEARNERS:10}

  # AI cost controls (DR-025)
  ai:
    weekly-ceiling-usd: ${AI_WEEKLY_CEILING_USD:25.00}
    alert-threshold-usd: ${AI_ALERT_THRESHOLD_USD:20.00}

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized   # full details only for authenticated users
  health:
    defaults:
      enabled: true

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.alphasoft.studyhub: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
