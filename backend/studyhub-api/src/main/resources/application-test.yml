# Test profile — uses H2 in-memory; Flyway runs migrations against H2
spring:
  datasource:
    url: jdbc:h2:mem:studyhub_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

studyhub:
  jwt:
    access-secret: test_access_secret_min32characters_xxxxxxxxxxx
    access-expiry-ms: 300000       # 5 min for tests
    refresh-secret: test_refresh_secret_min32characters_xxxxxxxxx
    refresh-expiry-ms: 3600000     # 1 hr for tests
  cookie:
    domain: localhost
    secure: false
    same-site: Strict
  cors:
    allowed-origins: http://localhost:5173
  pilot:
    max-learners: 10
  ai:
    weekly-ceiling-usd: 25.00
    alert-threshold-usd: 20.00

logging:
  level:
    root: WARN
    com.alphasoft.studyhub: DEBUG
